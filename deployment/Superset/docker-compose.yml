services:
  superset:
    image: apache/superset:4.1.3
    container_name: superset
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    # environment:
    #   SUPERSET_SECRET_KEY: dgzAHZ5O32Y8KSnczwcl-ahVVx4AfnW6qC2L6qC2L6Z8xTNQ
    #   SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config_minimal.py
    #   JWT_SECRET_KEY: vrTMp1gHzs96QySM5dXtEsW_D7e0mvIpQF71xEe9970
    volumes:
      - ./conf/superset_config.py:/app/pythonpath/superset_config.py
      - ./conf/requirements.txt:/app/requirements.txt
      - ./scripts/upload_dashboard.py:/app/upload_dashboard.py
      - ./dashboards:/app/dashboards
      - superset_home:/app/superset_home
    networks:
      - odax_network
    environment:
      - SUPERSET_SECRET_KEY=dgzAHZ5O32Y8KSnczwcl-ahVVx4AfnW6qC2L6Z8xTNQ
      - JWT_SECRET_KEY=vrTMp1gHzs96QySM5dXtEsW_D7e0mvIpQF71xEe9970
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      sh -c "
        pip install -r /app/requirements.txt &&
        gunicorn --bind 0.0.0.0:8088 --workers 4 --timeout 120 --limit-request-line 0 --limit-request-field_size 0 'superset.app:create_app()'
      "

  superset-init:
    image: apache/superset:4.1.3
    container_name: superset-init
    volumes:
      - ./conf/superset_config.py:/app/pythonpath/superset_config.py
      - ./conf/requirements.txt:/app/requirements.txt
      - superset_home:/app/superset_home
    networks:
      - odax_network
    environment:
      - SUPERSET_SECRET_KEY=dgzAHZ5O32Y8KSnczwcl-ahVVx4AfnW6qC2L6Z8xTNQ
      - JWT_SECRET_KEY=vrTMp1gHzs96QySM5dXtEsW_D7e0mvIpQF71xEe9970
    command: >
      sh -c "
        pip install -r /app/requirements.txt &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email tamara.baumgartner@akros.ch --password password &&
        superset init
      "
    depends_on:
      postgres:
        condition: service_healthy


  superset-upload:
    image: apache/superset:4.1.3
    container_name: superset-upload
    volumes:
      - ./conf/superset_config.py:/app/pythonpath/superset_config.py
      - ./conf/requirements.txt:/app/requirements.txt
      - ./scripts/upload_dashboard.py:/app/upload_dashboard.py
      - ./dashboards:/app/dashboards
      - superset_home:/app/superset_home
    networks:
      - odax_network
    environment:
      - SUPERSET_SECRET_KEY=dgzAHZ5O32Y8KSnczwcl-ahVVx4AfnW6qC2L6Z8xTNQ
      - JWT_SECRET_KEY=vrTMp1gHzs96QySM5dXtEsW_D7e0mvIpQF71xEe9970
    command: >
      sh -c "
        pip install -r /app/requirements.txt &&
        sleep 30 &&
        python /app/upload_dashboard.py
      "
    depends_on:
      superset:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

volumes:
  superset_home: 