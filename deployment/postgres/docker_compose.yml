services:
  postgres:
    image: postgres:16.1
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: "postgres_user"
      POSTGRES_PASSWORD: "postgres_password"
      POSTGRES_DB: "postgres_db"
    command: ["postgres", "-c", "wal_level=logical"]
    networks:
      odax_network:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d postgres_db"]
      interval: 5s
      timeout: 5s
      retries: 24

  bootstrap:
    image: python:3.11-slim
    container_name: bootstrap
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: "postgres_user"
      POSTGRES_PASSWORD: "postgres_password"
      POSTGRES_DB: "postgres_db"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
    volumes:
      - ./data:/app
    working_dir: /app

    networks:
      odax_network:
    command:
      sh -c "
      apt-get update && apt-get install -y postgresql-client &&
      psql -h postgres -U postgres_user -d postgres_db -f /app/initialize_airpollution_scheme.sql &&
      psql -h postgres -U postgres_user -d postgres_db -f /app/initialize_healthinsurance_scheme.sql 
      "
    depends_on:
      postgres:
        condition: service_healthy